# Zero-cost Windows build on the PUBLIC releases repo (standard runners are
# free for public repos; draft releases and their assets are visible only to
# users with push access - GitHub REST releases docs).
# Manual dispatch only: no push/PR triggers, so forks/PRs can never run it.
# Requires Actions secret PRIVATE_SOURCE_SSH_KEY: an SSH READ-ONLY deploy key
# on the private source repo only (git-protocol read access, no API scope).
# The private half lives only in this secret; never written to logs.
# Reviewed staged commit is pinned below; source push was be1531a on main.
name: Public Windows build (free runners, unsigned, draft-only)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed source commit SHA in the private repo (allowlisted)
        required: true
      release_tag:
        description: Tag for the draft release, e.g. v1.2.0
        required: true

permissions: {}

concurrency:
  group: public-windows-build
  cancel-in-progress: true

jobs:
  # Gate job: no secrets, no source. An arbitrary or unreviewed SHA dies here.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Validate inputs against the reviewed allowlist
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        id: check
        run: |
          set -euo pipefail
          case "$SOURCE_SHA" in *[!0-9a-f]*) echo "non-hex sha"; exit 1;; esac
          if [ "$SOURCE_SHA" != "be1531a83b9a11262a833dda3c49563998948d0f" ]; then
            echo "SHA $SOURCE_SHA is not the reviewed commit"; exit 1
          fi
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag"; exit 1;; esac
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # draft-release asset upload on THIS repo only
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oOViperXOo/orvanta-video-downloader-private
          ref: ${{ needs.validate.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify checked-out HEAD is the reviewed commit
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:SOURCE_SHA) { throw "HEAD $head != reviewed $env:SOURCE_SHA" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: FFmpeg and ffprobe (pinned, checksum-verified)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/media | Out-Null
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip' -OutFile ffmpeg.zip
          $expected = (Get-Content tools/ffmpeg-essentials.sha256 -Raw).Trim().ToLower()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive ffmpeg.zip -DestinationPath ffx -Force
          Get-ChildItem ffx -Recurse -Include ffmpeg.exe,ffprobe.exe | ForEach-Object { Copy-Item $_.FullName tools/media/ }
          Get-ChildItem ffx -Recurse -Filter LICENSE* | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName tools/media/FFmpeg-LICENSE.txt }
          Get-ChildItem ffx -Recurse -Filter README* | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName tools/media/FFmpeg-README.txt }
      - name: Prepare tools and first build
        shell: cmd
        run: build.bat < nul
      - name: Full test suite
        shell: cmd
        run: |
          set QT_QPA_PLATFORM=offscreen
          set PATH=%CD%\tools\media;%CD%\tools;%PATH%
          .venv\Scripts\python.exe -m pip install pytest pytest-timeout
          .venv\Scripts\python.exe -m pytest tests -q --timeout=120
      - name: NSIS compile + isolated install/upgrade/uninstall verification
        shell: pwsh
        run: tools\build_releases.ps1
      - name: Registered upgrade, equal-version reinstall and downgrade refusal
        shell: pwsh
        run: .venv\Scripts\python.exe tools\verify_registered_upgrade.py dist\RimaVideoDownloader-Setup.exe test-output\release\OrvantaVideoDownloader
      - name: Check no tokens in built artifacts
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist -Filter *.exe) {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f.FullName))
            if ($text -match 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}') { throw "token-like string found in $($f.Name)" }
          }
      - name: Hash the two release artifacts (explicit allowlist, never tests/ or source)
        shell: pwsh
        run: |
          Get-ChildItem dist\RimaVideoDownloader-Setup.exe, dist\RimaVideoDownloader-Portable.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - name: Upload to a DRAFT release on this repo (draft = push-access visibility only)
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft `
            --title "Rima Video Downloader $env:RELEASE_TAG (Windows, unsigned)" `
            --notes "Unsigned Windows build of reviewed commit $env:SOURCE_SHA. Draft: verify, then publish manually." `
            dist\RimaVideoDownloader-Setup.exe dist\RimaVideoDownloader-Portable.exe SHA256SUMS.txt
